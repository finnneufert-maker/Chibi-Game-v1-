<style>

</style></head><body><main class="app">

<section id="food" class="screen"><header><button class="back" data-go="home">←</button><h2>Küche</h2></header><div id="foodGrid" class="grid"></div></section><section id="closet" class="screen"><header><button class="back" data-go="home">←</button><h2>Kleiderschrank</h2></header><div id="closetGrid" class="grid"></div></section><section id="games" class="screen"><header><button class="back" data-go="home">←</button><h2>Minispiele</h2></header><div id="gameGrid" class="grid"></div></section><section id="collection" class="screen"><header><button class="back" data-go="start">←</button><h2>Sammlung</h2></header><div id="collectionGrid" class="grid"></div></section><section id="starGame" class="screen"><header><button class="back" data-go="games">×</button><h2 id="gameTitle">Sternenfänger</h2><b id="gameTimer">20</b></header><p id="gameHelp">Tippe schnell auf die Sterne!</p><div id="playfield"></div></section>
</main><div id="toast"></div><script>
const KEY='chibi-garden-v1',D={name:'Mochi',coins:20,hatched:false,hatchAt:0,stats:{hunger:82,thirst:86,joy:75,energy:90},look:{skin:0,hair:0,eyes:0,species:0,outfit:0},owned:['basic'],giftAt:0,lastSeen:Date.now(),room:0};let s=Object.assign({},D,JSON.parse(localStorage.getItem(KEY)||'{}'));s.stats=Object.assign({},D.stats,s.stats);s.look=Object.assign({},D.look,s.look);const O={skin:['#f7d7bd','#e9b58e','#bd7b57','#75452f'],hair:['#7455b8','#e8edf6','#f6c945','#9b5a45','#438bd1','#ef9fc3'],eyes:['Lila','Blau','Grün','Gold'],species:['Mensch','Neko','Fuchsgeist/Kitsune','Engel','Dämon'],outfit:['#8870f5','#ff82b2','#63c6cf','#f5a84b','#46516f','#d95882','#253d7a','#f3b3cf','#f5f0dc'],outfitNames:['Alltag','Neko-Set','Fuchsgeist-Set','Sternenanzug','Koch-Set','Sakura-Kimono','Nacht-Kimono','Fuchsgeist-Kimono','Morgen-Kimono']},foods=[['🥤','Wasser',0,2,30],['🧃','Fruchtsaft',4,6,24],['🍵','Tee',2,5,18],['🍙','Reisbällchen',12,8,0],['🍓','Erdbeeren',7,5,4],['🍜','Nudelsuppe',20,15,8],['🥞','Pfannkuchen',18,12,0],['🍱','Bento',28,20,0],['🍰','Kuchen',10,14,0],['🍡','Dango-Süßigkeit',8,7,0],['🍮','Mochi-Pudding',10,9,0],['🍪','Chibi-Keks',6,5,0],['🍩','Sakura-Donut',9,8,0]],clothes=[['basic','Alltagsset','👕',0],['neko','Neko-Set','🐱',20],['fox','Fuchsgeist-Set','🦊',45],['star','Sternenanzug','🌟',75],['chef','Koch-Set','🧑‍🍳',110],['kimonoSakura','Sakura-Kimono','👘',150],['kimonoNight','Nacht-Kimono','🌌',200],['kimonoKitsune','Fuchsgeist-Kimono','🦊',260],['kimonoMorning','Morgen-Kimono','🌸',330]],rooms=[['Rosa Zimmer','room-0'],['Garten','room-1'],['Sternennacht','room-2'],['Kochküche','room-3']];
function save(){s.lastSeen=Date.now();localStorage.setItem(KEY,JSON.stringify(s))}function toast(t){let e=document.querySelector('#toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),1700)}function go(id){document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));document.querySelector('#'+id).classList.add('active');render()}document.addEventListener('click',e=>{let id=e.target.closest('[data-go]')?.dataset.go;if(id)go(id)});
function drawAvatar(el){if(!el)return;let sp=s.look.species,features=sp===1?'<i class="ear left"></i><i class="ear right"></i><i class="tail"></i>':sp===2?'<i class="ear left"></i><i class="ear right"></i><i class="tail"></i><i class="tail second"></i>':sp===3?'<i class="ear left"></i><i class="ear right"></i><i class="tail"></i>':sp===4?'<i class="halo"></i>':sp===5?'<i class="horn left"></i><i class="horn right"></i>':'';let eyeColors=['#7455b8','#438bd1','#54a66a','#d9a521'];el.className=(el.className.replace(' anime','')+' anime').trim();el.dataset.outfit=s.look.outfit;el.style.setProperty('--skin',O.skin[s.look.skin]);el.style.setProperty('--hair',O.hair[s.look.hair]);el.style.setProperty('--eyes',eyeColors[s.look.eyes]);el.style.setProperty('--outfit',O.outfit[s.look.outfit%O.outfit.length]);el.innerHTML=features+'<div class="hair-back"></div><div class="head"><div class="bangs"></div><i class="eye left"></i><i class="eye right"></i><i class="mouth"></i></div><i class="arm left"></i><i class="arm right"></i><div class="torso"><i class="collar"></i></div><i class="leg left"></i><i class="leg right"></i>'}
function builder(){let b=document.querySelector('#builder');b.innerHTML='';[['skin','Hautfarbe'],['hair','Haarfarbe'],['eyes','Augenfarbe'],['species','Fantasy-Design'],['outfit','Kleidungsfarbe']].forEach(([k,t])=>{let r=document.createElement('div');r.className='builder-row';r.innerHTML='<strong>'+t+'</strong><div class="choices"></div>';O[k].forEach((v,i)=>{let q=document.createElement('button'),isColor=k==='skin'||k==='hair'||k==='outfit';q.textContent=isColor?'●':v;if(isColor)q.style.color=v;if(s.look[k]===i)q.classList.add('selected');q.onclick=()=>{s.look[k]=i;save();render()};r.lastChild.append(q)});b.append(r)})}
function mood(){if(s.stats.thirst<25)return'🥤 Ich brauche etwas zu trinken!';if(s.stats.hunger<25)return'🍱 Mein Bauch knurrt!';if(s.stats.energy<25)return'💤 Ich bin müde...';if(s.stats.joy<25)return'😿 Ein Spiel wäre schön!';if(s.stats.thirst<50)return'💧 Ein kleiner Schluck?';return'✨ Alles super!'}
function render(){petName.textContent=s.name;coins.textContent=s.coins;['hunger','thirst','joy','energy'].forEach(k=>document.querySelector('#'+k).value=s.stats[k]);drawAvatar(document.querySelector('#avatar'));drawAvatar(document.querySelector('#roomAvatar'));let room=rooms[s.room%rooms.length];roomScene.className='room-bg '+room[1];roomLabel.textContent=room[0];reaction.textContent=mood();builder();foodGrid.innerHTML=foods.map(([i,n,v,c,t],x)=>'<div class="card"><div class="icon">'+i+'</div><b>'+n+'</b><p>'+(v?'+'+v+' Hunger':'')+(t?' · +'+t+' Durst':'')+' · 🪙 '+c+'</p><button onclick="feed('+x+')">'+(t?'Trinken':'Essen')+'</button></div>').join('');closetGrid.innerHTML=clothes.map(([id,n,i,c],x)=>'<div class="card '+(!s.owned.includes(id)&&s.coins<c?'locked':'')+'"><div class="icon">'+i+'</div><b>'+n+'</b><p>'+(s.owned.includes(id)?'Freigeschaltet':'🪙 '+c)+'</p><button onclick="dress('+x+')">'+(s.owned.includes(id)?'Anziehen':'Freischalten')+'</button></div>').join('');let gs=[['⭐','Sternenfänger',true,0],['🧠','Memory-Blitz',s.coins>=30,30],['🍳','Chibi-Küche',s.coins>=60,60],['☁️','Wolkenlauf',s.coins>=100,100]];gameGrid.innerHTML=gs.map(([i,n,on,c],x)=>'<div class="card '+(on?'':'locked')+'"><div class="icon">'+i+'</div><b>'+n+'</b><p>'+(on?'Bereit':'Ab 🪙 '+c)+'</p><button '+(!on?'disabled':'')+' onclick="startGame('+x+')">'+(on?'Spielen':'🔒')+'</button></div>').join('');collectionGrid.innerHTML=clothes.map(([id,n,i])=>'<div class="card '+(s.owned.includes(id)?'':'locked')+'"><div class="icon">'+(s.owned.includes(id)?i:'❔')+'</div><b>'+(s.owned.includes(id)?n:'Unbekannt')+'</b></div>').join('');eggState()}
dailyGift.onclick=()=>{let now=Date.now();if(now-s.giftAt<86400000)return toast('Das nächste Geschenk kommt morgen.');s.giftAt=now;s.coins+=25;save();render();toast('Magisches Geschenk: +25 Münzen! ✨')};lunaPreset.onclick=()=>{nameInput.value='Luna';s.name='Luna';s.look={skin:0,hair:1,eyes:0,species:1,outfit:0};save();render();toast('Luna-Vorlage ausgewählt! 🌙')};saveCharacter.onclick=()=>{s.name=nameInput.value.trim()||'Mochi';if(!s.hatchAt)s.hatchAt=Date.now()+2*3600000;save();render();go('home');toast(s.name+' wurde gespeichert!')};nameInput.value=s.name;shareBtn.onclick=async()=>{let d={title:'MochiMori',text:'Schau dir MochiMori an!',url:location.href};if(navigator.share)await navigator.share(d);else{await navigator.clipboard.writeText(location.href);toast('Link kopiert!')}};petBtn.onclick=()=>{if(!s.hatched)return toast('Erst muss das Ei schlüpfen.');s.stats.joy=Math.min(100,s.stats.joy+8);save();render();toast(s.name+' freut sich! ✨')};restBtn.onclick=rest;roomBtn.onclick=cycleRoom;
function eggState(){if(s.hatched){eggPanel.style.display='none';return}eggPanel.style.display='block';if(!s.hatchAt)s.hatchAt=Date.now()+2*3600000;let l=s.hatchAt-Date.now();if(l<=0){s.hatched=true;save();toast(s.name+' ist geschlüpft! 🎉');return render()}let m=Math.ceil(l/60000);eggText.textContent='Schlüpft in '+Math.floor(m/60)+' Std. '+m%60+' Min.'}egg.onclick=()=>{s.hatchAt-=60000;save();eggState();toast('Das Ei wackelt!')};
function feed(x){let [i,n,v,c,t]=foods[x];if(!s.hatched)return toast('Erst muss dein Chibi schlüpfen.');if(s.coins<c)return toast('Dafür fehlen Münzen.');s.coins-=c;s.stats.hunger=Math.min(100,s.stats.hunger+v);s.stats.thirst=Math.min(100,s.stats.thirst+t);s.stats.joy=Math.min(100,s.stats.joy+(t?3:2));save();render();toast((t?'🥤 ':'')+n+' serviert!')}function rest(){if(!s.hatched)return toast('Erst muss dein Chibi schlüpfen.');s.stats.energy=Math.min(100,s.stats.energy+35);s.stats.thirst=Math.max(0,s.stats.thirst-3);save();render();toast('Eine erholsame Pause! 🌙')}function cycleRoom(){s.room=(s.room+1)%rooms.length;save();render();toast(rooms[s.room][0]+' geöffnet!')}function dress(x){let [id,n,i,c]=clothes[x];if(!s.owned.includes(id)){if(s.coins<c)return toast('Sammle mehr Münzen.');s.coins-=c;s.owned.push(id)}s.look.outfit=x%O.outfit.length;save();render();toast(n+' ausgewählt!')}
function startGame(type){if(s.stats.energy<5)return toast('Dein Chibi braucht erst etwas Schlaf.');let titles=['Sternenfänger','Memory-Blitz','Chibi-Küche','Wolkenlauf'],helps=['Fange die Sterne!','Finde den richtigen Stern!','Klicke die Gerichte in der Reihenfolge!','Tippe die Wolke, bevor sie weiterzieht!'],icons=['⭐','🧠','🍙','☁️'];gameTitle.textContent=titles[type];gameHelp.textContent=helps[type];go('starGame');let score=0,time=type===2?20:15,p=playfield;p.innerHTML='';s.stats.energy=Math.max(0,s.stats.energy-5);function target(icon,good){let b=document.createElement('button');b.className='game-target';b.textContent=icon;b.style.left=Math.random()*78+'%';b.style.top=Math.random()*75+'%';b.onclick=()=>{if(good){score++;toast('Treffer! ✨')}else{score=Math.max(0,score-1);toast('Fast!')}round()};p.append(b)}function round(){p.innerHTML='';if(type===0){target('⭐',true)}else if(type===1){let correct=Math.floor(Math.random()*6);for(let i=0;i<6;i++)target(i===correct?'🌟':'🟣',i===correct)}else if(type===2){let seq=['🍙','🥤','🍓','🍵'],step=score%seq.length;p.innerHTML='<div class="sequence-note">Als Nächstes: '+seq[step]+'</div>';['🍙','🥤','🍓','🍵'].forEach(x=>{let b=document.createElement('button');b.className='game-target';b.textContent=x;b.style.left=Math.random()*70+'%';b.style.top=(20+Math.random()*65)+'%';b.onclick=()=>{if(x===seq[step]){score++;round()}else toast('Die Reihenfolge stimmt noch nicht.');};p.append(b)})}else target('☁️',true)}round();gameTimer.textContent=time;let z=setInterval(()=>{gameTimer.textContent=--time;if(time<=0){clearInterval(z);let reward=Math.min(12,3+score);s.coins+=reward;s.stats.joy=Math.min(100,s.stats.joy+10);save();go('games');toast(score+' Punkte · +'+reward+' Münzen')}},1000)}
let h=Math.min(24,(Date.now()-s.lastSeen)/3600000);s.stats.hunger=Math.max(0,s.stats.hunger-h*2);s.stats.thirst=Math.max(0,s.stats.thirst-h*2.5);save();render();setInterval(eggState,30000);
</script></body></html>

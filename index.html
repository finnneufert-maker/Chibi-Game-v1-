<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#8468f5"><title>MochiMori</title>
<style>
:root{font-family:system-ui,sans-serif;color:#403858;background:#efeaff;--p:#8468f5;--pink:#ff82b2}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at top,#fff 0,#efeaff 50%,#d9cdfc 100%)}button,input{font:inherit}.app{max-width:480px;min-height:100vh;margin:auto;background:#fff9;box-shadow:0 0 30px #58449b22}.screen{display:none;min-height:100vh;padding:22px}.screen.active{display:block}#start.active{display:flex;flex-direction:column;justify-content:center;text-align:center;gap:14px}.logo{font-size:72px}h1{font-size:42px;margin:0;color:#6044c5}.subtitle{margin:0 0 25px;color:#766d8d}button{border:0;border-radius:18px;background:#fff;padding:14px;color:#514767;box-shadow:0 5px 14px #4535821c;font-weight:750}button:active{transform:scale(.97)}.primary{color:white;background:linear-gradient(135deg,var(--p),var(--pink))}small{color:#817993}header{display:flex;align-items:center;gap:12px;margin-bottom:18px}header h2{flex:1;margin:0}.back{width:44px;padding:11px}.coins{background:#fff4bd;border-radius:20px;padding:9px}.avatar{width:190px;height:230px;margin:14px auto;position:relative;display:grid;place-items:center}.ears{position:absolute;top:7px;font-size:76px}.hair{position:absolute;top:26px;font-size:98px;z-index:1}.face{width:112px;height:112px;border-radius:48% 48% 44% 44%;background:var(--skin);z-index:2;display:flex;align-items:center;justify-content:center;font-size:32px}.body{position:absolute;top:131px;width:100px;height:89px;border-radius:42px 42px 25px 25px;background:var(--outfit);z-index:1}.large{transform:scale(1.15);margin-top:30px;margin-bottom:38px}.builder-row{margin:14px 0}.builder-row strong{display:block;margin-bottom:8px}.choices{display:flex;gap:8px;overflow:auto;padding-bottom:5px}.choices button{min-width:54px;padding:11px}.choices .selected{outline:3px solid var(--p);background:#eee9ff}label{display:block;font-weight:700}input{width:100%;border:2px solid #ddd2ff;border-radius:14px;padding:13px;margin-top:7px}.egg-panel{text-align:center}.egg-panel button{font-size:80px;background:none;box-shadow:none;padding:0;animation:float 2s ease-in-out infinite}@keyframes float{50%{transform:translateY(-8px) rotate(3deg)}}.meters{display:grid;gap:8px;background:#fff;padding:15px;border-radius:22px}.meters div{display:grid;grid-template-columns:100px 1fr;align-items:center}.meters span{font-size:13px;font-weight:700}progress{width:100%;accent-color:var(--p)}.actions{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:15px}.actions button{font-size:22px;padding:11px 4px}.actions span{display:block;font-size:11px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.card{background:#fff;padding:16px;border-radius:20px;box-shadow:0 6px 18px #4c377f18;text-align:center}.icon{font-size:42px}.locked{filter:grayscale(1);opacity:.55}.card button{background:#eee9ff;width:100%;margin-top:8px}#playfield{height:68vh;position:relative;border-radius:24px;background:linear-gradient(#342d6b,#8a6cff);overflow:hidden}.star{position:absolute;font-size:48px;background:none;box-shadow:none;padding:4px}#toast{position:fixed;bottom:25px;left:50%;transform:translate(-50%,30px);background:#403858;color:white;padding:12px 18px;border-radius:20px;opacity:0;transition:.25s;pointer-events:none;z-index:10}#toast.show{opacity:1;transform:translate(-50%,0)}
</style></head><body><main class="app">
<section id="start" class="screen active"><div class="logo">🌙</div><h1>MochiMori</h1><p class="subtitle">Erschaffe deinen kleinen Begleiter</p><button data-go="create" class="primary">Figur erstellen</button><button data-go="home">Spielen</button><button id="shareBtn">Spiel teilen</button><button data-go="collection">Sammlung</button><small>Dein Fortschritt wird auf diesem Gerät gespeichert.</small></section>
<section id="create" class="screen"><header><button class="back" data-go="start">←</button><h2>Chibi-Werkstatt</h2></header><div id="avatar" class="avatar"></div><label>Name <input id="nameInput" maxlength="14" placeholder="Mochi"></label><div id="builder"></div><button id="saveCharacter" class="primary">Chibi speichern</button></section>
<section id="home" class="screen"><header><button class="back" data-go="start">☰</button><h2 id="petName">Mochi</h2><div class="coins">🪙 <b id="coins">0</b></div></header><div id="roomAvatar" class="avatar large"></div><div id="eggPanel" class="egg-panel"><button id="egg">🥚</button><p id="eggText"></p></div><div class="meters"><div><span>🍜 Hunger</span><progress id="hunger" max="100"></progress></div><div><span>💧 Durst</span><progress id="thirst" max="100"></progress></div><div><span>✨ Freude</span><progress id="joy" max="100"></progress></div><div><span>🌙 Energie</span><progress id="energy" max="100"></progress></div></div><nav class="actions"><button data-go="food">🍱<span>Essen</span></button><button data-go="closet">👗<span>Kleidung</span></button><button data-go="games">🎮<span>Spiele</span></button><button id="petBtn">🫳<span>Streicheln</span></button></nav></section>
<section id="food" class="screen"><header><button class="back" data-go="home">←</button><h2>Küche</h2></header><div id="foodGrid" class="grid"></div></section><section id="closet" class="screen"><header><button class="back" data-go="home">←</button><h2>Kleiderschrank</h2></header><div id="closetGrid" class="grid"></div></section><section id="games" class="screen"><header><button class="back" data-go="home">←</button><h2>Minispiele</h2></header><div id="gameGrid" class="grid"></div></section><section id="collection" class="screen"><header><button class="back" data-go="start">←</button><h2>Sammlung</h2></header><div id="collectionGrid" class="grid"></div></section><section id="starGame" class="screen"><header><button class="back" data-go="games">×</button><h2>Sternenfänger</h2><b id="gameTimer">20</b></header><p>Tippe schnell auf die Sterne!</p><div id="playfield"></div></section>
</main><div id="toast"></div><script>
const KEY='chibi-garden-v1',D={name:'Mochi',coins:20,hatched:false,hatchAt:0,stats:{hunger:82,thirst:86,joy:75,energy:90},look:{skin:0,hair:0,eyes:0,species:0,outfit:0},owned:['basic'],lastSeen:Date.now()};let s=Object.assign({},D,JSON.parse(localStorage.getItem(KEY)||'{}'));s.stats=Object.assign({},D.stats,s.stats);s.look=Object.assign({},D.look,s.look);const O={skin:['#f7d7bd','#e9b58e','#bd7b57','#75452f'],hair:['🟣','⚪','🟡','🟤','🔵','🌸'],eyes:['◕‿◕','◉‿◉','^‿^','•ᴗ•'],species:['Mensch','Neko','Fuchsgeist','Engel','Dämon'],outfit:['#8870f5','#ff82b2','#63c6cf','#f5a84b','#46516f']},foods=[['🍙','Reisbällchen',12,8],['🍓','Erdbeeren',7,5],['🍜','Nudelsuppe',20,15],['🥞','Pfannkuchen',18,12],['🍱','Bento',28,20],['🍰','Kuchen',10,14]],clothes=[['basic','Alltagsset','👕',0],['neko','Neko-Set','🐱',30],['fox','Fuchsgeist-Set','🦊',60],['star','Sternenanzug','🌟',100],['chef','Koch-Set','🧑‍🍳',140],['moon','Mond-Set','🌙',200]];
function save(){s.lastSeen=Date.now();localStorage.setItem(KEY,JSON.stringify(s))}function toast(t){let e=document.querySelector('#toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),1700)}function go(id){document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));document.querySelector('#'+id).classList.add('active');render()}document.addEventListener('click',e=>{let id=e.target.closest('[data-go]')?.dataset.go;if(id)go(id)});
function avatar(el){let sp=s.look.species,ear=sp===1?'🐱':sp===2?'🦊':sp===3?'😇':sp===4?'😈':'';el.style.setProperty('--skin',O.skin[s.look.skin]);el.style.setProperty('--outfit',O.outfit[s.look.outfit]);el.innerHTML='<div class="ears">'+ear+'</div><div class="hair">'+O.hair[s.look.hair]+'</div><div class="face">'+O.eyes[s.look.eyes]+'</div><div class="body"></div>'}
function builder(){let b=document.querySelector('#builder');b.innerHTML='';[['skin','Hautfarbe'],['hair','Haare'],['eyes','Augen'],['species','Fantasy-Design'],['outfit','Kleidungsfarbe']].forEach(([k,t])=>{let r=document.createElement('div');r.className='builder-row';r.innerHTML='<strong>'+t+'</strong><div class="choices"></div>';O[k].forEach((v,i)=>{let q=document.createElement('button');q.textContent=k==='skin'||k==='outfit'?'●':v;if(k==='skin'||k==='outfit')q.style.color=v;if(s.look[k]===i)q.classList.add('selected');q.onclick=()=>{s.look[k]=i;save();render()};r.lastChild.append(q)});b.append(r)})}
function render(){petName.textContent=s.name;coins.textContent=s.coins;['hunger','thirst','joy','energy'].forEach(k=>document.querySelector('#'+k).value=s.stats[k]);avatar(avatar);avatar(roomAvatar);builder();foodGrid.innerHTML=foods.map(([i,n,v,c],x)=>'<div class="card '+(x<2||s.coins>=x*25?'':'locked')+'"><div class="icon">'+i+'</div><b>'+n+'</b><p>+'+v+' Hunger · 🪙 '+c+'</p><button onclick="feed('+x+')">Füttern</button></div>').join('');closetGrid.innerHTML=clothes.map(([id,n,i,c],x)=>'<div class="card '+(!s.owned.includes(id)&&s.coins<c?'locked':'')+'"><div class="icon">'+i+'</div><b>'+n+'</b><p>'+(s.owned.includes(id)?'Freigeschaltet':'🪙 '+c)+'</p><button onclick="dress('+x+')">'+(s.owned.includes(id)?'Anziehen':'Freischalten')+'</button></div>').join('');let gs=[['⭐','Sternenfänger',1],['🧠','Memory',s.coins>=40],['🍳','Chibi-Küche',s.coins>=90],['🏃','Wolkenlauf',s.coins>=160]];gameGrid.innerHTML=gs.map(([i,n,on],x)=>'<div class="card '+(on?'':'locked')+'"><div class="icon">'+i+'</div><b>'+n+'</b><p>'+(on?'Bereit':'Noch gesperrt')+'</p><button '+(!on?'disabled':'')+' onclick="'+(x?'':'game()')+'">'+(on?'Spielen':'🔒')+'</button></div>').join('');collectionGrid.innerHTML=clothes.map(([id,n,i])=>'<div class="card '+(s.owned.includes(id)?'':'locked')+'"><div class="icon">'+(s.owned.includes(id)?i:'❔')+'</div><b>'+(s.owned.includes(id)?n:'Unbekannt')+'</b></div>').join('');eggState()}
saveCharacter.onclick=()=>{s.name=nameInput.value.trim()||'Mochi';if(!s.hatchAt)s.hatchAt=Date.now()+2*3600000;save();go('home');toast('Chibi gespeichert!')};nameInput.value=s.name;shareBtn.onclick=async()=>{let d={title:'MochiMori',text:'Schau dir MochiMori an!',url:location.href};if(navigator.share)await navigator.share(d);else{await navigator.clipboard.writeText(location.href);toast('Link kopiert!')}};petBtn.onclick=()=>{if(!s.hatched)return toast('Erst muss das Ei schlüpfen.');s.stats.joy=Math.min(100,s.stats.joy+8);save();render();toast(s.name+' freut sich! ✨')};
function eggState(){if(s.hatched){eggPanel.style.display='none';return}eggPanel.style.display='block';if(!s.hatchAt)s.hatchAt=Date.now()+2*3600000;let l=s.hatchAt-Date.now();if(l<=0){s.hatched=true;save();toast(s.name+' ist geschlüpft! 🎉');return render()}let m=Math.ceil(l/60000);eggText.textContent='Schlüpft in '+Math.floor(m/60)+' Std. '+m%60+' Min.'}egg.onclick=()=>{s.hatchAt-=60000;save();eggState();toast('Das Ei wackelt!')};
function feed(x){let [i,n,v,c]=foods[x];if(!s.hatched)return toast('Erst muss dein Chibi schlüpfen.');if(s.coins<c)return toast('Dafür fehlen Münzen.');s.coins-=c;s.stats.hunger=Math.min(100,s.stats.hunger+v);save();render();toast(n+' serviert!')}function dress(x){let [id,n,i,c]=clothes[x];if(!s.owned.includes(id)){if(s.coins<c)return toast('Sammle mehr Münzen.');s.coins-=c;s.owned.push(id)}s.look.outfit=x%O.outfit.length;save();render();toast(n+' ausgewählt!')}
function game(){go('starGame');let score=0,time=20,p=playfield;function spawn(){p.innerHTML='';let b=document.createElement('button');b.className='star';b.textContent='⭐';b.style.left=Math.random()*80+'%';b.style.top=Math.random()*80+'%';b.onclick=()=>{score++;spawn()};p.append(b)}spawn();gameTimer.textContent=time;let z=setInterval(()=>{gameTimer.textContent=--time;if(time<=0){clearInterval(z);s.coins+=score*2;s.stats.joy=Math.min(100,s.stats.joy+10);save();go('games');toast(score+' Sterne · +'+score*2+' Münzen')}},1000)}
let h=Math.min(24,(Date.now()-s.lastSeen)/3600000);s.stats.hunger=Math.max(0,s.stats.hunger-h*2);s.stats.thirst=Math.max(0,s.stats.thirst-h*2.5);save();render();setInterval(eggState,30000);
</script></body></html>

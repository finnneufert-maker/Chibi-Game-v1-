name: Build MochiMori APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Create Android project
        shell: bash
        run: |
          mkdir -p app/src/main/java/com/mochimori/game app/src/main/res/drawable app/src/main/res/mipmap-hdpi
          cp mochimori-icon.png app/src/main/res/drawable/mochimori_icon.png

          cat > settings.gradle.kts <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name = "MochiMori"
          include(":app")
          EOF

          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.5.2" apply false
          }
          EOF

          cat > app/build.gradle.kts <<'EOF'
          plugins { id("com.android.application") }
          android {
              namespace = "com.mochimori.game"
              compileSdk = 35
              defaultConfig {
                  applicationId = "com.mochimori.game"
                  minSdk = 24
                  targetSdk = 35
                  versionCode = 2
                  versionName = "1.1"
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <application android:theme="@style/AppTheme" android:label="MochiMori" android:icon="@drawable/mochimori_icon" android:allowBackup="true">
                  <activity android:name=".MainActivity" android:screenOrientation="portrait" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          mkdir -p app/src/main/res/values
          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="AppTheme" parent="android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:colorAccent">#8B5CF6</item>
                  <item name="android:navigationBarColor">#F3EEFF</item>
                  <item name="android:statusBarColor">#F3EEFF</item>
                  <item name="android:windowLightStatusBar">true</item>
              </style>
          </resources>
          EOF

          cat > app/src/main/java/com/mochimori/game/MainActivity.java <<'EOF'
          package com.mochimori.game;

          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {
              private WebView webView;

              @Override public void onCreate(Bundle state) {
                  super.onCreate(state);
                  webView = new WebView(this);
                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setCacheMode(WebSettings.LOAD_NO_CACHE);
                  webView.clearCache(true);
                  webView.setWebViewClient(new WebViewClient());
                  webView.loadUrl("https://finnneufert-maker.github.io/Chibi-Game-v1-/?app=1.1");
                  setContentView(webView);
              }

              @Override public void onBackPressed() {
                  if (webView.canGoBack()) webView.goBack(); else super.onBackPressed();
              }
          }
          EOF

      - name: Build APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Prepare download
        run: cp app/build/outputs/apk/debug/app-debug.apk MochiMori.apk

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: MochiMori-APK
          path: MochiMori.apk

      - name: Publish APK release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete mochimori-v1.0 --cleanup-tag --yes || true
          gh release create mochimori-v1.0 MochiMori.apk --title "MochiMori 1.1" --notes "Neue Kleidung, Pets, Reaktionen und Minispiele. Die App lädt immer die aktuelle Spielversion."
